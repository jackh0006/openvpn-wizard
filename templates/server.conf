# OpenVPN Wizard - Server Config Template
# Generated by install.sh

dev tun
proto tcp-server
port {{OVPN_PORT}}
local 0.0.0.0
topology subnet
server {{OVPN_NETWORK}}

ca ca.crt
cert server.crt
key server.key
dh none
tls-crypt-v2 tls-crypt-v2-server.key
crl-verify crl.pem

cipher {{CIPHER}}
data-ciphers {{CIPHER}}:CHACHA20-POLY1305
data-ciphers-fallback {{CIPHER}}
auth {{AUTH}}

tls-version-min 1.3
tls-ciphersuites {{TLS_CIPHER}}

allow-compression no
comp-lzo no
push "comp-lzo no"

keepalive 10 60
push "redirect-gateway def1 bypass-dhcp"
push "dhcp-option DNS 1.1.1.1"
push "dhcp-option DNS 1.0.0.1"
push "dhcp-option DNS 8.8.8.8"
push "block-outside-dns"
push "block-ipv6"

tun-mtu 1500
mssfix 1360
sndbuf 524288
rcvbuf 524288
txqueuelen 1000

user openvpn
group openvpn
persist-key
persist-tun
status /var/log/openvpn-status.log 10
log-append /var/log/openvpn.log
verb 3
mute 20
reneg-sec 0
client-to-client
duplicate-cn
max-clients 500

management 127.0.0.1 7505