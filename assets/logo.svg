<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0066ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)" opacity="0.15"/>
  
  <!-- Shield shape -->
  <path d="M100 15 C146.9 15 185 53.1 185 100 C185 130 150 165 100 185 C50 165 15 130 15 100 C15 53.1 53.1 15 100 15 Z" 
        fill="none" stroke="url(#grad1)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Lock icon -->
  <g transform="translate(100, 100)">
    <!-- Lock body -->
    <rect x="-18" y="-8" width="36" height="28" rx="4" ry="4" 
          fill="none" stroke="url(#grad1)" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Lock shackle -->
    <path d="M-12 -8 C-12 -18 -4 -18 -4 -8" 
          fill="none" stroke="url(#grad1)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
    <!-- Keyhole -->
    <circle cx="0" cy="8" r="4" fill="url(#grad1)" filter="url(#glow)"/>
    <rect x="-2" y="8" width="4" height="8" fill="url(#grad1)"/>
    <circle cx="0" cy="16" r="2" fill="#0d1117"/>
  </g>
  
  <!-- Network nodes -->
  <g transform="translate(100, 100)">
    <circle cx="-50" cy="-40" r="4" fill="#00d4aa" filter="url(#glow)"/>
    <circle cx="50" cy="-40" r="4" fill="#0066ff" filter="url(#glow)"/>
    <circle cx="0" cy="50" r="4" fill="#7c3aed" filter="url(#glow)"/>
    
    <!-- Connection lines -->
    <line x1="0" y1="0" x2="-50" y2="-40" stroke="url(#grad1)" stroke-width="1.5" opacity="0.6" stroke-dasharray="4,4"/>
    <line x1="0" y1="0" x2="50" y2="-40" stroke="url(#grad1)" stroke-width="1.5" opacity="0.6" stroke-dasharray="4,4"/>
    <line x1="0" y1="0" x2="0" y2="50" stroke="url(#grad1)" stroke-width="1.5" opacity="0.6" stroke-dasharray="4,4"/>
  </g>
</svg>