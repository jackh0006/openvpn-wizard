[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vpn-installer"
version = "1.0.0"
description = "OpenVPN-over-HAProxy Installer - Stealthy, multiplexed VPN on port 443"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "jackh0006", email = "jackh109867@gmail.com"}
]
maintainers = [
    {name = "jackh0006", email = "jackh109867@gmail.com"}
]
keywords = [
    "vpn", "openvpn", "haproxy", "vless", "reality", "privacy", "security", "ubuntu"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7.0",
    "textual>=0.44.0",
    "typer>=0.9.0",
    "jinja2>=3.1.0",
    "cryptography>=42.0.0",
    "psutil>=5.9.0",
    "requests>=2.31.0",
    "qrcode>=7.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
vpn-installer = "installer.__main__:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["installer*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true