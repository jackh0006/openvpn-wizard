# SPDX-License-Identifier: MIT
name: Shellcheck

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: |
          for f in install.sh openvpn-wizard-linux.sh openvpn-wizard-termux.sh tests/integration.sh; do
            bash -n "$f" || exit 1
          done
          echo "bash -n: OK"
      - name: shellcheck
        uses: koalaman/shellcheck@v1
        with:
          severity: error
          check_together: 'yes'
